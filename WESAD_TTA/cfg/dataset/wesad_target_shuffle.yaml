# WESAD 評価時の target loader だけを shuffle する設定。
# Tent/OFTTA の batch composition 影響を調べるために使う。
dataset: wesad
dataset_dir: ../self_learning_wesad/WESAD
processed_dir: ./data/wesad/processed
use_processed: true
subjects: null
window_seconds: 5
sampling_rate: 700
window_size: 3500
num_channels: 8
num_classes: 2
label_mode: binary
calibration_windows: 60
batch_size: 64
num_workers: 0
target_shuffle: true
